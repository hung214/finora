name: Tag on main

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: 讀取 pubspec 版本（去除 +build）
        id: version
        run: |
          VER=$(grep -m1 '^version:' pubspec.yaml | sed 's/version: //; s/+.*//' | tr -d ' \r')
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "版本：v$VER"
      - name: 建立版本標籤（不存在時；tasks.md §0.1 Tag 規範）
        run: |
          TAG="v${{ steps.version.outputs.version }}"
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "標籤 $TAG 已存在，略過"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$TAG" -m "Release $TAG（merge to main 自動標籤）"
            git push origin "$TAG"
            echo "已建立並推送 $TAG（觸發 release 工作流）"
          fi
