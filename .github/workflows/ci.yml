name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: 安裝依賴
        run: flutter pub get
      - name: 靜態分析（零警告為 gate，tasks.md §2.4）
        run: flutter analyze
        # 本機注意：專案路徑含非 ASCII（如「記帳」）時 flutter analyze 的 LSP 會崩潰，
        # 改用 `dart analyze`（同一組 analysis_options 規則）。CI checkout 路徑為 ASCII，不受影響。
      - name: 後端單元/整合測試（@BE，PR gate）
        run: flutter test

  # TODO(T-H9)：truth 對齊測試（drift schema ↔ data-spec.dbml、pubspec ↔ techstack.md）加入本 job
  # TODO(SP-7)：四平台 build（windows/macos：MSIX/DMG notarization）於 M5–M7 加入
